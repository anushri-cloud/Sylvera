<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sylvera London CRM Build Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working ledger. Slim masthead, tab bar, then dense filterable tables; summary before detail. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#eceef2; --line:#d9dce3; --fg:#1b1d24; --muted:#5d6272;
  --accent:#7d1d3a; --accent-soft:#f4e6eb; --gold:#9a7a3c;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a6200; --warn-bg:#fbf0d9; --bad:#b3261e; --bad-bg:#fbe5e3; --info:#2a5d9f; --info-bg:#e4edf8; --idle:#6b7080; --idle-bg:#eceef2;
  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151a; --surface:#1b1e25; --sunk:#22262f; --line:#323745; --fg:#e8e9ee; --muted:#a0a5b4;
  --accent:#e0839f; --accent-soft:#3a1f29; --gold:#d2b277;
  --ok:#6fd09c; --ok-bg:#183326; --warn:#f0bd5c; --warn-bg:#3a2d12; --bad:#f2958d; --bad-bg:#3d1c1a; --info:#8fb6ec; --info-bg:#1b2a40; --idle:#a0a5b4; --idle-bg:#262a33;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151a; --surface:#1b1e25; --sunk:#22262f; --line:#323745; --fg:#e8e9ee; --muted:#a0a5b4;
  --accent:#e0839f; --accent-soft:#3a1f29; --gold:#d2b277;
  --ok:#6fd09c; --ok-bg:#183326; --warn:#f0bd5c; --warn-bg:#3a2d12; --bad:#f2958d; --bad-bg:#3d1c1a; --info:#8fb6ec; --info-bg:#1b2a40; --idle:#a0a5b4; --idle-bg:#262a33;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
@media (max-width:560px){.wrap{padding-inline:16px}}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* masthead */
.mast{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}
.facts b{color:var(--fg);font-weight:600}
.mode{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:var(--r);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:600}
.badge.dirty{background:var(--warn-bg);color:var(--warn)}
/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin:16px 0 18px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
/* overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:34px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;color:var(--muted)}
.gantt{overflow-x:auto}
.gantt-inner{min-width:560px;position:relative}
.g-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;min-height:38px}
.g-lab{font-size:13px;font-weight:600}
.g-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.g-track{position:relative;height:22px;background:var(--sunk);border-radius:4px}
.g-seg{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden}
.g-seg>i{display:block;height:100%;background:var(--accent);opacity:.85}
.g-axis{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:4px}
.g-ticks{position:relative;height:16px}
.g-ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--muted);white-space:nowrap}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--gold);pointer-events:none}
.g-today em{position:absolute;top:-2px;left:4px;font-style:normal;font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.attn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.attn li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:13px}
.empty{color:var(--muted);font-size:13px}
.wk h3{font-size:15px;margin:0 0 8px}
.wk dl{margin:0;display:grid;gap:8px}
.wk dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wk dd{margin:0;white-space:pre-wrap}
/* filters + tables */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg)}
.filters input{min-width:0;flex:1 1 200px;max-width:320px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font:inherit;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .mono{color:var(--muted);font-size:11px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--bg);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:12px}
td.item{min-width:260px}
td.notes{min-width:200px;color:var(--muted)}
td.wide{min-width:220px}
tbody td:first-child{white-space:nowrap}
td input,td select,td textarea{font:inherit;font-size:13px;width:100%;min-width:90px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
td textarea{min-height:52px;resize:vertical;min-width:200px}
td input[type=date]{min-width:130px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.s-done,.s-live,.s-received,.s-green{background:var(--ok-bg);color:var(--ok)}
.s-progress,.s-build,.s-qa{background:var(--info-bg);color:var(--info)}
.s-review,.s-amber{background:var(--warn-bg);color:var(--warn)}
.s-blocked,.s-overdue,.s-red{background:var(--bad-bg);color:var(--bad)}
.s-idle{background:var(--idle-bg);color:var(--idle)}
.late{color:var(--bad);font-weight:600}
a.lnk{color:var(--accent)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px}
.del.arm{color:var(--bad);font-weight:700}
.rowadd{margin-top:10px}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:13px;z-index:10}
.wform{display:grid;gap:10px;margin-bottom:16px}
.wform label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.wform textarea,.wform input,.wform select{font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg)}
.wform textarea{min-height:64px;resize:vertical}
.wlist{display:grid;gap:12px}
.whead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
/* archive */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl>li{display:grid;grid-template-columns:96px 18px minmax(0,1fr);gap:0 12px}
.tl .when{text-align:right;padding-top:14px}
.tl .when b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1}
.tl .when span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tl .rail{position:relative}
.tl .rail:before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:1px solid var(--line)}
.tl .dot{position:absolute;left:3px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .dot.t-Approval{background:var(--accent)}
.tl .card{margin:8px 0;min-width:0}
.tl .card h3{margin:0;font-size:16px}
.tl .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--muted);margin:4px 0 10px}
.tl .links{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:4px}
.tl .links li{font-size:13px;overflow-wrap:anywhere}
.tl .links li:before{content:"↗";color:var(--accent);margin-right:6px;font-size:12px}
.tl .links li.txt:before{content:"·"}
.tl .who{font-size:13px}
@media (max-width:560px){.tl>li{grid-template-columns:62px 14px minmax(0,1fr);gap:0 8px}.tl .when b{font-size:20px}}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hist li{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;font-size:13px}
.hist ul{margin:0;padding-left:16px;display:grid;gap:2px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.xp{margin-top:14px;display:grid;gap:12px}
.xp-row{display:flex;flex-wrap:wrap;gap:12px 28px}
.xp fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.xp legend{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0;margin-bottom:6px;width:100%}
.xp label{font-size:13px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:border-color .15s,background .15s}}
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow">Digital Nexa · CRM Implementation</div>
      <h1>Sylvera · HubSpot Project Tracker</h1>
      <div class="facts">
        <span>Build start <b>8 Oct 2026</b></span>
        <span>Go-live <b>20 Nov 2026</b></span>
        <span id="f-days"></span>
        <span>Last saved <b id="f-saved">–</b></span>
      </div>
    </div>
    <div class="mode">
      <span class="badge" id="m-badge">Loading…</span>
      <button class="btn" id="m-export" hidden aria-expanded="false" aria-controls="xp">Export</button>
      <button class="btn" id="m-edit" hidden>Edit tracker</button>
      <button class="btn primary" id="m-save" hidden disabled>Save changes</button>
    </div>
  </header>

  <section class="panel xp" id="xp" hidden aria-label="Export the tracker">
    <div class="xp-row">
      <fieldset><legend>Format</legend>
        <label><input type="radio" name="xf" value="pdf" id="xf-pdf" checked> PDF</label>
        <label><input type="radio" name="xf" value="docx" id="xf-docx"> Word (.docx)</label>
        <label><input type="radio" name="xf" value="html" id="xf-html"> HTML</label>
      </fieldset>
      <fieldset><legend>Include</legend>
        <label><input type="checkbox" value="overview" id="xs-overview" checked> Summary</label>
        <label><input type="checkbox" value="build" id="xs-build" checked> Build sheet</label>
        <label><input type="checkbox" value="assets" id="xs-assets" checked> Assets tracker</label>
        <label><input type="checkbox" value="actions" id="xs-actions" checked> Client actions</label>
        <label><input type="checkbox" value="weekly" id="xs-weekly" checked> Weekly updates</label>
        <label><input type="checkbox" value="register" id="xs-register" checked> Changes &amp; risks</label>
        <label><input type="checkbox" value="archive" id="xs-archive" checked> Archive</label>
      </fieldset>
    </div>
    <div class="xp-row" style="align-items:center">
      <button class="btn primary" id="xp-go">Download</button>
      <button class="btn" id="xp-close">Close</button>
      <span class="muted" id="xp-msg" style="font-size:12px">Exports the saved tracker as of today.</span>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="overview" id="t-overview">Overview</button>
    <button class="tab" role="tab" data-tab="build" id="t-build">Build sheet <span class="n" id="n-build"></span></button>
    <button class="tab" role="tab" data-tab="assets" id="t-assets">Assets tracker <span class="n" id="n-assets"></span></button>
    <button class="tab" role="tab" data-tab="actions" id="t-actions">Client actions <span class="n" id="n-actions"></span></button>
    <button class="tab" role="tab" data-tab="weekly" id="t-weekly">Weekly updates <span class="n" id="n-weekly"></span></button>
    <button class="tab" role="tab" data-tab="register" id="t-register">Changes &amp; risks <span class="n" id="n-register"></span></button>
    <button class="tab" role="tab" data-tab="archive" id="t-archive">Archive <span class="n" id="n-archive"></span></button>
  </nav>

  <main id="view"><p class="empty">Loading the tracker…</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const BUILD_ST=["Not started","In progress","In review","Blocked","Done"];
const ASSET_ST=["Not started","In build","QA","Client review","Live"];
const ACT_ST=["Open","Received","Not needed"];
const RAG=["Green","Amber","Red"];
const OWNERS=["NEXA CRM Specialist","NEXA Shopify Team","NEXA Project Director","Sylvera London"];
const PHASES={1:"Foundations",2:"Pipelines, scoring, core automation",3:"Commerce, migration, channels, consent",4:"Reporting, training, UAT, go-live"};
const PH_DATES={1:["2026-10-08","2026-10-21"],2:["2026-10-15","2026-11-04"],3:["2026-10-22","2026-11-11"],4:["2026-11-05","2026-11-20"]};
const START="2026-10-08", GOLIVE="2026-11-20";

let S=null, editing=false, canWrite=false, artifactNs=null, dirty=0, saving=false;
let tab="overview";
const F={build:{phase:"",status:"",owner:"",q:""},assets:{cat:"",status:"",phase:"",q:""}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=iso=>{if(!iso)return"–";const [y,m,d]=iso.split("-").map(Number);return d+" "+MON[m-1]};
const dnum=iso=>Date.UTC(...iso.split("-").map((v,i)=>i==1?v-1:+v))/864e5;
const weekNo=iso=>Math.floor((dnum(iso)-dnum(START))/7)+1;
const weekStart=n=>{const t=(dnum(START)+(n-1)*7)*864e5;const d=new Date(t);return d.toISOString().slice(0,10)};

function stClass(s){return({"Done":"s-done","Completed":"s-done","Approved":"s-done","Scheduled":"s-progress","Pending approval":"s-review","Live":"s-live","Received":"s-received","Green":"s-green","In progress":"s-progress","In build":"s-build","QA":"s-qa","In review":"s-review","Client review":"s-review","Amber":"s-amber","Blocked":"s-blocked","Overdue":"s-overdue","Red":"s-red"})[s]||"s-idle"}
const pill=s=>`<span class="pill ${stClass(s)}">${esc(s)}</span>`;
const isLate=r=>r.due && r.status!=="Done" && r.due<todayISO();
const actStatus=a=>a.status==="Open" && a.due<todayISO()?"Overdue":a.status;

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function markDirty(row){if(row)row.updated=todayISO();dirty++;updateMode()}
function updateMode(){
  const b=$("m-badge"),e=$("m-edit"),s=$("m-save");
  if(!S){b.textContent="Loading…";return}
  if(!canWrite){b.textContent="View only";b.className="badge";e.hidden=true;s.hidden=true;return}
  e.hidden=false;e.textContent=editing?"Done editing":"Edit tracker";
  s.hidden=!editing&&!dirty;s.disabled=!dirty||saving;s.textContent=saving?"Saving…":"Save changes";
  if(dirty){b.textContent=dirty+" unsaved change"+(dirty>1?"s":"");b.className="badge dirty"}
  else{b.textContent=editing?"Editing":"Up to date";b.className="badge"}
}
function header(){
  const t=todayISO(),left=Math.round(dnum(GOLIVE)-dnum(t));
  $("f-days").innerHTML=left>0?`<b>${left}</b> days to go-live · Week <b>${Math.max(1,weekNo(t))}</b>`:left===0?"<b>Go-live today</b>":"<b>Live</b> · post go-live support";
  $("f-saved").textContent=fmt(S.meta.lastSaved);
  $("n-build").textContent=S.build.length;$("n-assets").textContent=S.assets.length;
  const open=S.actions.filter(a=>a.status==="Open").length;$("n-actions").textContent=open+" open";$("n-weekly").textContent=S.weekly.length;$("n-archive").textContent=(S.archive||[]).length;$("n-register").textContent=S.register.filter(x=>!["Closed","Rejected","Mitigated","Implemented"].includes(x.status)).length+" open";
}

/* ---------- Overview ---------- */
function overview(){
  const t=todayISO();
  const done=S.build.filter(r=>r.status==="Done").length, bp=Math.round(done/S.build.length*100);
  const live=S.assets.filter(a=>a.status==="Live").length, ap=Math.round(live/S.assets.length*100);
  const openA=S.actions.filter(a=>a.status==="Open"), overA=openA.filter(a=>a.due<t);
  const blocked=S.build.filter(r=>r.status==="Blocked"), late=S.build.filter(isLate);
  const hiRisk=(S.register||[]).filter(x=>!regClosed(x)&&rating(x)==="High");
  const latest=[...S.weekly].sort((a,b)=>b.week.localeCompare(a.week))[0];
  const g0=dnum(START),g1=dnum("2026-11-21"),span=g1-g0,pct=iso=>Math.min(100,Math.max(0,(dnum(iso)-g0)/span*100));
  let ticks="";for(let i=0;i<7;i++){const w=weekStart(i+1);ticks+=`<span style="left:${pct(w)}%">W${i+1} · ${fmt(w)}</span>`}

  const att=[...overA.map(a=>`<li>${pill("Overdue")}<span><span class="mono">${a.id}</span> ${esc(a.item)} <span class="muted">· client, due ${fmt(a.due)}</span></span></li>`),

  const nextDue=S.build.filter(r=>r.status!=="Done"&&r.due>=t).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
  return `<section class="kpis">

      <div class="panel"><h2>Due next</h2>${nextDue.length?`<ul class="attn">${nextDue.map(r=>`<li><span class="mono">${fmt(r.due)}</span><span>${esc(r.item)} <span class="muted">· ${esc(r.owner)}</span></span></li>`).join("")}</ul>`:`<p class="empty">Nothing outstanding.</p>`}</div>

/* ---------- change log ---------- */
let baseline=null;
const snap=()=>{baseline=JSON.parse(JSON.stringify(S))};
function diffSummary(){
  const out=[],B=baseline||{};
  const cfg=[["build","Build item","item",["status","due","owner"]],["assets","Asset","name",["status","qa","link"]],["actions","Client action","item",["status","received","due"]],["register","Register item","title",["status"]]];
  cfg.forEach(([k,label,nameF,fields])=>{
    const before=new Map((B[k]||[]).map(r=>[r.id,r]));const now=new Map((S[k]||[]).map(r=>[r.id,r]));
    let other=0;
    (S[k]||[]).forEach(r=>{const o=before.get(r.id);if(!o){out.push(`${label} ${r.id} added: ${r[nameF]}`);return}
      let hit=false;fields.forEach(f=>{if((o[f]||"")!==(r[f]||"")){hit=true;
        if(f==="status")out.push(`${r.id} ${r[nameF]}: ${o.status} → ${r.status}`);
        else if(f==="due")out.push(`${r.id} due date moved ${fmt(o.due)} → ${fmt(r.due)}`);
        else if(f==="owner")out.push(`${r.id} owner changed to ${r.owner}`);
        else if(f==="received"&&r.received)out.push(`${r.id} received ${fmt(r.received)}`);
        else if(f==="link"&&r.link)out.push(`${r.id} ${r[nameF]}: HubSpot link added`);
        else if(f==="qa")out.push(`${r.id} ${r[nameF]}: QA ${r.qa}`);}});
      if(!hit&&JSON.stringify(o)!==JSON.stringify(r))other++;});
    before.forEach((o,id)=>{if(!now.has(id))out.push(`${label} ${id} removed: ${o[nameF]}`)});
    if(other)out.push(`${other} other ${label.toLowerCase()} edit${other>1?"s":""} (text or notes)`);
  });
  const wb=new Set((B.weekly||[]).map(w=>w.id));S.weekly.forEach(w=>{if(!wb.has(w.id))out.push(`Weekly update added for w/c ${fmt(w.week)}`)});
  if(JSON.stringify(B.weekly)!==JSON.stringify(S.weekly)&&!out.some(s=>s.startsWith("Weekly")))out.push("Weekly update edited");
  const ab=new Map((B.archive||[]).map(a=>[a.id,a]));(S.archive||[]).forEach(a=>{const o=ab.get(a.id);if(!o)out.push(`Archive entry added: ${a.stage||a.type} (${fmt(a.date)})`);else if(JSON.stringify(o)!==JSON.stringify(a))out.push(`Archive entry updated: ${a.stage||a.type}`)});
  ab.forEach((o,id)=>{if(!(S.archive||[]).some(a=>a.id===id))out.push(`Archive entry removed: ${o.stage||o.type}`)});
  return out.slice(0,25).concat(out.length>25?[`…and ${out.length-25} more changes`]:[]);
}

  const W=doc.internal.pageSize.getWidth()-64;
  doc.setFont("helvetica","normal");doc.setFontSize(20);doc.text(pdfSafe(m.title),32,44);
  doc.setFontSize(10);doc.setTextColor(93,98,114);doc.text(pdfSafe(m.sub),32,62);
  let y=84;
  m.secs.forEach((s,i)=>{
    if(i&&y>doc.internal.pageSize.getHeight()-120){doc.addPage();y=44}
    doc.setFontSize(12);doc.setTextColor(125,29,58);doc.text(pdfSafe(s.title.toUpperCase()),32,y);
    const cs={};s.widths.forEach((w,k)=>cs[k]={cellWidth:W*w/100});
    doc.autoTable({startY:y+8,head:[s.cols.map(pdfSafe)],body:s.rows.map(r=>r.map(pdfSafe)),margin:{left:32,right:32},columnStyles:cs,
      styles:{font:"helvetica",fontSize:7.5,cellPadding:3,textColor:[27,29,36],lineColor:[217,220,227],lineWidth:.5,overflow:"linebreak"},
      headStyles:{fillColor:[236,238,242],textColor:[93,98,114],fontStyle:"bold"}});
    y=doc.lastAutoTable.finalY+28;
  });
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(93,98,114);doc.text(`Page ${i} of ${n}`,doc.internal.pageSize.getWidth()-32,doc.internal.pageSize.getHeight()-16,{align:"right"})}
  return doc.output("blob");
}
async function exportDOCX(m){
  await loadScript("https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js");
  const D=window.docx;
  const para=(t,o={})=>new D.Paragraph({children:String(t??"").split("\n").map((ln,i)=>new D.TextRun({text:ln,break:i?1:0,size:o.size||16,bold:o.bold,color:o.color,font:"Calibri"})),spacing:o.spacing});
  const border={style:D.BorderStyle.SINGLE,size:4,color:"D9DCE3"};
  const kids=[para(m.title,{size:40,spacing:{after:80}}),para(m.sub,{size:18,color:"5D6272",spacing:{after:240}})];
  m.secs.forEach(s=>{
    kids.push(para(s.title.toUpperCase(),{size:22,bold:true,color:"7D1D3A",spacing:{before:240,after:120}}));
    const row=(cells,head)=>new D.TableRow({tableHeader:!!head,children:cells.map((c,k)=>new D.TableCell({width:{size:s.widths[k]*50,type:D.WidthType.PERCENTAGE},shading:head?{fill:"ECEEF2",type:D.ShadingType.CLEAR,color:"auto"}:undefined,
      borders:{top:border,bottom:border,left:border,right:border},margins:{top:40,bottom:40,left:60,right:60},children:[para(c,{bold:head,size:head?15:16,color:head?"5D6272":"1B1D24"})]}))});
    kids.push(new D.Table({width:{size:5000,type:D.WidthType.PERCENTAGE},rows:[row(s.cols,true),...s.rows.map(r=>row(r,false))]}));
  });
  const doc=new D.Document({creator:"Digital Nexa",title:m.title,sections:[{properties:{page:{size:{orientation:D.PageOrientation.LANDSCAPE},margin:{top:720,bottom:720,left:720,right:720}}},children:kids}]});
  return D.Packer.toBlob(doc);
}
async function runExport(){
  const fmtSel=document.querySelector('input[name="xf"]:checked').value;
  const sel=[...document.querySelectorAll('#xp input[type=checkbox]:checked')].map(c=>c.value);
  const msg=$("xp-msg"),go=$("xp-go");
  if(!sel.length){msg.textContent="Pick at least one section to export.";return}
  if(dirty){msg.textContent="Save your changes first, so the export matches what the client sees.";return}
  go.disabled=true;msg.textContent="Preparing the file…";
  try{
    const m=exportModel(sel),base=`Sylvera-HubSpot-Project-Tracker-${todayISO()}`;
    let data,ext;
    if(fmtSel==="html"){data=exportHTML(m);ext="html"}
    else if(fmtSel==="pdf"){data=await exportPDF(m);ext="pdf"}
    else{data=await exportDOCX(m);ext="docx"}
    if(dlNs)await dlNs.save({filename:`${base}.${ext}`,data});
    else{const blob=data instanceof Blob?data:new Blob([data],{type:"text/html"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=`${base}.${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    msg.textContent="Saved.";
  }catch(err){
    const c=err&&err.code;
    msg.textContent=c==="declined"?"Download cancelled.":c==="rate_limited"?"A download prompt is already open. Try again in a moment.":c==="extension_not_enabled"?"That format isn't available in this view. Try HTML.":err&&err.message==="load"?"The export library couldn't load. Check your connection and try again.":"The export didn't complete. Try again.";
  }finally{go.disabled=false}
}
$("m-export").addEventListener("click",()=>{const p=$("xp");p.hidden=!p.hidden;$("m-export").setAttribute("aria-expanded",String(!p.hidden));$("xp-msg").textContent="Exports the saved tracker as of today."});
$("xp-close").addEventListener("click",()=>{$("xp").hidden=true;$("m-export").setAttribute("aria-expanded","false")});
$("xp-go").addEventListener("click",runExport);
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

(async function init(){
  const h=(location.hash||"").slice(1);if(["overview","build","assets","actions","weekly","register","archive"].includes(h))tab=h;
  try{const r=await fetch("data/tracker.json",{cache:"no-store"});if(!r.ok)throw 0;S=await r.json();S.archive=S.archive||[];S.history=S.history||[];S.register=S.register||[];snap()}
  catch(_){ $("view").innerHTML=`<p class="empty">The tracker data could not be loaded. Refresh the page to try again.</p>`;$("m-badge").textContent="Offline";return}
  render();
  try{
    if(window.claude&&window.claude.use){
      const [u,a,dl]=await Promise.all([window.claude.use("user"),window.claude.use("artifact"),window.claude.use("downloads")]);
      dlNs=dl;$("m-export").hidden=!dl;
      artifactNs=a;const ce=u?await u.canEdit():false;canWrite=!!(a&&ce);render();
    }else{$("m-export").hidden=false;updateMode()}
  }catch(_){$("m-export").hidden=false;updateMode()}
})();
})();
